   <g id="text_2">
    <text style="font-style: italic; font-size: 8.5px; font-family: 'Times New Roman'; text-anchor: start; fill: #52514e" x="7.2" y="66.217449" transform="rotate(-0 7.2 66.217449)">N-extein–C(O)–NH–Cys1 (intein) … Asn–NH–Cys+1 (C-extein)</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'Times New Roman'; text-anchor: start; fill: #0b0b0b" x="7.2" y="94.104815" transform="rotate(-0 7.2 94.104815)">Step 1  N→S acyl shift</text>
   </g>
   <g id="text_4">
