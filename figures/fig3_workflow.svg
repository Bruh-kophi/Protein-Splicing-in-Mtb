   <g id="text_1">
    <text style="font-size: 8px; font-family: 'Times New Roman'; fill: #0b0b0b" transform="translate(124.099375 26.266141)">H37Rv reference proteome (UniProt UP000001584)</text>
    <text style="font-size: 8px; font-family: 'Times New Roman'; fill: #0b0b0b" transform="translate(130.984375 35.958484)">and intein coordinates of RecA, SufB and DnaB</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8px; font-family: 'Times New Roman'; fill: #0b0b0b" transform="translate(128.430625 71.530891)">In silico digestion of precursor and spliced forms:</text>
    <text style="font-size: 8px; font-family: 'Times New Roman'; fill: #0b0b0b" transform="translate(120.881875 80.945734)">diagnostic peptide types 1–4 and expected intein share</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8px; font-family: 'Times New Roman'; fill: #0b0b0b" transform="translate(42.610625 122.422156)">Dataset 1: Progenio</text>
    <text style="font-size: 8px; font-family: 'Times New Roman'; fill: #0b0b0b" transform="translate(23.90875 132.137)">SAWC507 / SAWC5527, DDA</text>
    <text style="font-size: 8px; font-family: 'Times New Roman'; fill: #0b0b0b" transform="translate(22.839375 141.333094)">MaxQuant protein-group export</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8px; font-family: 'Times New Roman'; fill: #0b0b0b" transform="translate(48.728125 169.453281)">repaired export;</text>
    <text style="font-size: 8px; font-family: 'Times New Roman'; fill: #0b0b0b" transform="translate(21.036875 178.8975)">targeted panel, cleavage-agnostic</text>
    <text style="font-size: 8px; font-family: 'Times New Roman'; fill: #0b0b0b" transform="translate(34.84 188.364219)">and split-match searches</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8px; font-family: 'Times New Roman'; fill: #0b0b0b" transform="translate(170.971875 127.967391)">Dataset 2: PXD009315</text>
    <text style="font-size: 8px; font-family: 'Times New Roman'; fill: #0b0b0b" transform="translate(165.64375 136.819734)">Q Exactive, DDA, 16 runs</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8px; font-family: 'Times New Roman'; fill: #0b0b0b" transform="translate(162.054375 169.442031)">MS-GF+ semi-tryptic search</text>
    <text style="font-size: 8px; font-family: 'Times New Roman'; fill: #0b0b0b" transform="translate(170.310625 178.90875)">with spliced sequences;</text>
    <text style="font-size: 8px; font-family: 'Times New Roman'; fill: #0b0b0b" transform="translate(164.975625 188.364219)">Casanovo de novo (2 runs)</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8px; font-family: 'Times New Roman'; fill: #0b0b0b" transform="translate(291.118125 127.328641)">Dataset 3: rifampicin vs DMSO</text>
    <text style="font-size: 8px; font-family: 'Times New Roman'; fill: #0b0b0b" transform="translate(285.975625 136.980359)">timsTOF Pro 2, diaPASEF, 10 runs</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8px; font-family: 'Times New Roman'; fill: #0b0b0b" transform="translate(298.8725 169.442031)">diaTracer, then MSFragger</text>
    <text style="font-size: 8px; font-family: 'Times New Roman'; fill: #0b0b0b" transform="translate(303.345 178.8975)">semi-tryptic search with</text>
    <text style="font-size: 8px; font-family: 'Times New Roman'; fill: #0b0b0b" transform="translate(297.123125 188.364219)">spliced sequences; DIA-NN</text>
   </g>
   <g id="text_9">
    <text style="font-size: 8px; font-family: 'Times New Roman'; fill: #0b0b0b" transform="translate(65.890625 222.843656)">Intein analysis, the same for every dataset: peptides by region on RecA, SufB and DnaB;</text>
    <text style="font-size: 8px; font-family: 'Times New Roman'; fill: #0b0b0b" transform="translate(60.003125 232.2585)">diagnostic types 1–4; non-tryptic termini against background; junction matches at any score;</text>
    <text style="font-size: 8px; font-family: 'Times New Roman'; fill: #0b0b0b" transform="translate(116.1025 241.725219)">depletion test (exact binomial) with pseudo-intein control</text>
   </g>
   <g id="text_10">
    <text style="font-size: 8px; font-family: 'Times New Roman'; fill: #0b0b0b" transform="translate(101.99625 280.247156)">Evidence standard: fragment ions bracketing the bond in question.</text>
    <text style="font-size: 8px; font-family: 'Times New Roman'; fill: #0b0b0b" transform="translate(70.66875 289.702625)">Dataset 3 also: DIA-NN q-values and retention time, decoys of identical composition,</text>
    <text style="font-size: 8px; font-family: 'Times New Roman'; fill: #0b0b0b" transform="translate(54.008125 299.169344)">junction-to-extein ratio, rifampicin vs DMSO. Datasets compared as patterns, never as numbers.</text>
   </g>
  </g>
 </g>
